name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14" # как в backend/Dockerfile
      - name: Install
        run: pip install .[dev]
      - name: Tests
        run: pytest -q
      - name: Dependency audit (pip-audit)
        continue-on-error: true # информативно, не блокирует
        run: |
          pip install pip-audit
          pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26" # как в frontend/Dockerfile
      - name: Install
        run: npm ci
      - name: i18n check (все русские строки переведены на EN)
        run: npm run check-i18n
      - name: Dependency audit (npm audit)
        continue-on-error: true # информативно, не блокирует
        run: npm audit --audit-level=high
      - name: Build
        run: npm run build

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build backend image
        run: docker build -t acontrol-backend ./backend
      - name: Trivy scan (backend image)
        continue-on-error: true # отчёт по CVE в образе, не блокирует
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: acontrol-backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
