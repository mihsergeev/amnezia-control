name: Publish images

# Собирает и публикует multi-arch (amd64 + arm64) образы backend и frontend в
# GitHub Container Registry при выпуске релиза. Так пользователи ставят панель из
# готовых версионированных образов (docker compose pull) без локальной сборки.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/amnezia-control-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Дым-тест ДО публикации: собираем образ локально (amd64) и убеждаемся, что
      # он вообще импортируется. Релиз v0.47.1 уехал в GHCR с пустым config.py —
      # сборка прошла, а контейнер не стартовал; такая проверка это ловит.
      - name: Build for smoke test
        if: matrix.name == 'backend'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          tags: smoke-test:latest

      - name: Smoke test (backend image imports)
        if: matrix.name == 'backend'
        run: |
          docker run --rm --entrypoint python smoke-test:latest \
            -c "import app.main; from app.config import Settings; print('образ стартует')"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
