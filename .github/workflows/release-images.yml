name: Publish images

# Собирает и публикует multi-arch (amd64 + arm64) образы backend и frontend в
# GitHub Container Registry при выпуске релиза. Так пользователи ставят панель из
# готовых версионированных образов (docker compose pull) без локальной сборки.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/amnezia-control-${{ matrix.name }}
          # latest ставим сами и только на опубликованный стабильный релиз: без
          # latest=false metadata-action добавил бы его и к semver-тегам при ручном
          # запуске (workflow_dispatch) на теге. Ручной запуск latest не трогает,
          # а с ветки получает только тег sha-<коммит>, чтобы было что публиковать.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}

      # Дым-тест ДО публикации: собираем образ локально (amd64) и убеждаемся, что
      # он вообще импортируется. Релиз v0.47.1 уехал в GHCR с пустым config.py —
      # сборка прошла, а контейнер не стартовал; такая проверка это ловит.
      - name: Build for smoke test
        if: matrix.name == 'backend'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: smoke-test:latest

      - name: Smoke test (backend image imports)
        if: matrix.name == 'backend'
        run: |
          docker run --rm --entrypoint python smoke-test:latest \
            -c "import app.main; from app.config import Settings; print('образ стартует')"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
