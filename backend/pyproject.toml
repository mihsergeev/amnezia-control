[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acontrol-backend"
version = "0.8.0"
description = "Amnezia Control — backend for the self-hosted VPN management panel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    "bcrypt>=4.1,<6",
    "PyJWT>=2.8,<3",
    "asyncssh>=2.17,<3",
    # без верхней границы: у cryptography каждый релиз мажорный (43 -> 49),
    # потолок отрезал бы исправления безопасности
    "cryptography>=43.0",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
